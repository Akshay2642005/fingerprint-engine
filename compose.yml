services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    ports:
      # AMQP protocol port (for applications to connect)
      - "5672:5672"
      # HTTP Management UI port
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    container_name: fingerprint-worker
    restart: always
    ports:
      # Public FPKG surface (worker is also reached through the ingress).
      - "8081:8080"
    expose:
      # ADR-014 §4: the metrics/probe surface stays network-internal. Local
      # development publishes it through compose.override.yml.
      - "9091"
    environment:
      - FPKG_LOG_LEVEL=info
      - FPKG_AMQP_USER=guest
      - FPKG_AMQP_PASSWORD=guest
    command:
      - "start"
      - "--transport=tcp"
      - "--listen=0.0.0.0:8080"
      - "--publish=amqp"
      - "--amqp-address=rabbitmq:5672"
    depends_on:
      - rabbitmq

  ingress:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ingress
    container_name: fingerprint-ingress
    restart: always
    ports:
      # Public HTTP surface.
      - "8080:8080"
    expose:
      # ADR-014 §4: the metrics/probe surface stays network-internal. Local
      # development publishes it through compose.override.yml.
      - "9090"
    environment:
      - FPKG_LOG_LEVEL=info
      - FPKG_WORKERS=worker:8080
    command:
      - "start"
      - "--listen=0.0.0.0:8080"
      - "--worker=worker:8080"
    depends_on:
      - worker

volumes:
  rabbitmq_data:
  rabbitmq_logs:
