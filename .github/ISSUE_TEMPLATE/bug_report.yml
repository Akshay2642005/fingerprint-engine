name: Bug report
description: Report a bug in the fingerprint engine, WASM module, build, or docs
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Before filing, please
        check the existing issues and the [contributing guide](../../CONTRIBUTING.md).
  - type: input
    id: version
    attributes:
      label: Engine version
      description: Release tag or commit SHA you are using (e.g. `v0.2.0`).
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: zig-version
    attributes:
      label: Zig version
      description: Output of `zig version`.
      placeholder: 0.14.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the bug reproduce?
      multiple: true
      options:
        - Browser (WASM / npm package)
        - Zig build system
        - Tests
        - Docs
        - CI
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error output, logs, or screenshots.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro steps. Link a gist or repo if the repro is large.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — browser/OS details, flags used, etc.
