# Fingerprint Engine — Release Pipeline
#
# Triggered by tags matching v* (e.g., v0.1.0, v0.2.0).
# Builds the WASM artifact, publishes the npm package, and creates a
# GitHub Release. Workers ship as Docker containers — no native SDK.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: 0.14.1
  # Node 20 deprecation: GitHub runners use Node 24 by default
  # These actions work fine on Node 24 despite the deprecation warnings
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run unit tests
        run: zig build test --summary all

  build-wasm:
    name: Build WASM
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM module
        run: zig build wasm -Doptimize=ReleaseSmall

      - name: Rename WASM artifact
        run: |
          TAG=${GITHUB_REF_NAME#v}
          mv zig-out/bin/fingerprint.wasm zig-out/bin/fingerprint-${TAG}.wasm

      - name: Upload WASM release artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-wasm-release
          path: zig-out/bin/fingerprint-*.wasm

  create-release:
    name: Create Release
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release archive
        run: |
          mkdir -p release-assets
          TAG=${GITHUB_REF_NAME#v}
          # Flatten artifacts into release-assets/
          cp -r artifacts/*/* release-assets/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF_NAME}
          cat > RELEASE_NOTES.md <<EOF
          ## Fingerprint Engine ${TAG}

          ### Changes
          See the [changelog](CHANGELOG.md) for a full list of changes in this release.

          ### Artifacts
          - \`fingerprint-*.wasm\` — WebAssembly module for browser SDK
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fingerprint Engine ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            RELEASE_NOTES.md
          draft: false
          prerelease: false

  publish-npm:
    name: Publish to npm
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build npm package
        run: |
          cd sdk/browser
          npm run build

      - name: Publish to npm
        run: |
          cd sdk/browser
          npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
