# Fingerprint Engine — Release Pipeline
#
# Triggered by tags matching v* (e.g., v0.1.0, v0.2.1).
# Builds native binaries for all platforms, WASM, publishes npm,
# pushes worker/ingress images to GHCR, and creates a GitHub Release.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: 0.14.1
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run unit tests
        run: zig build test --summary all

  build-binaries:
    name: Build binaries (${{ matrix.target }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            zig_target: x86_64-linux-musl
            suffix: ""
          - target: aarch64-linux-musl
            zig_target: aarch64-linux-musl
            suffix: ""
          - target: x86_64-macos
            zig_target: x86_64-macos
            suffix: ""
          - target: aarch64-macos
            zig_target: aarch64-macos
            suffix: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build fingerprint, worker, and ingress
        run: |
          TAG=${GITHUB_REF_NAME#v}
          OUTDIR="release-${{ matrix.target }}/fingerprint-${TAG}-${{ matrix.target }}"
          mkdir -p "$OUTDIR"
          zig build fingerprint worker ingress \
            -Dtarget=${{ matrix.zig_target }} \
            --release=safe
          cp zig-out/bin/fingerprint "$OUTDIR/"
          cp zig-out/bin/worker "$OUTDIR/"
          cp zig-out/bin/ingress "$OUTDIR/"

      - name: Create release archive
        run: |
          TAG=${GITHUB_REF_NAME#v}
          cd release-${{ matrix.target }}
          tar czf "../fingerprint-${TAG}-${{ matrix.target }}.tar.gz" *

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.target }}
          path: "*.tar.gz"

  build-wasm:
    name: Build WASM
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM module
        run: zig build wasm

      - name: Rename WASM artifact
        run: |
          TAG=${GITHUB_REF_NAME#v}
          mv zig-out/bin/fingerprint.wasm zig-out/bin/fingerprint-${TAG}.wasm

      - name: Upload WASM release artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-wasm-release
          path: zig-out/bin/fingerprint-*.wasm

  create-release:
    name: Create Release
    needs: [build-wasm, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release assets
        run: |
          mkdir -p release-assets
          cp artifacts/*.wasm release-assets/ 2>/dev/null || true
          cp artifacts/*.tar.gz release-assets/ 2>/dev/null || true

      - name: Generate release notes
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          cat > RELEASE_NOTES.md <<EOF
          ## Fingerprint Engine ${TAG}

          ### Changes
          See the [changelog](CHANGELOG.md) for a full list of changes in this release.

          ### Artifacts

          **WebAssembly:**
          - \`fingerprint-${VERSION}.wasm\` — WebAssembly module for bench/test containers

          **Native binaries** (fingerprint + worker + ingress):
          - \`fingerprint-${VERSION}-x86_64-linux-musl.tar.gz\` — Linux x86_64 (Alpine/musl)
          - \`fingerprint-${VERSION}-aarch64-linux-musl.tar.gz\` — Linux aarch64 (Alpine/musl)
          - \`fingerprint-${VERSION}-x86_64-macos.tar.gz\` — macOS x86_64 (Intel)
          - \`fingerprint-${VERSION}-aarch64-macos.tar.gz\` — macOS aarch64 (Apple Silicon)

          **Docker images (GHCR):**
          - \`ghcr.io/${GITHUB_REPOSITORY,,}/fingerprint-worker:${TAG}\`
          - \`ghcr.io/${GITHUB_REPOSITORY,,}/fingerprint-ingress:${TAG}\`

          **npm:**
          - \`@akshay2642005/fingerprint-sdk@${VERSION}\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fingerprint Engine ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            RELEASE_NOTES.md
          draft: false
          prerelease: false

  release-docker:
    name: Release worker image (GHCR)
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/fingerprint-worker" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  release-docker-ingress:
    name: Release ingress image (GHCR)
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/fingerprint-ingress" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ingress image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ingress
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  publish-npm:
    name: Publish to npm
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Build npm package
        run: |
          zig build clients:browser

      - name: Publish to npm
        run: |
          PACKAGE="@akshay2642005/fingerprint-sdk"
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "npm: $PACKAGE@$VERSION already published — skipping"
            exit 0
          fi
          cd src/clients/browser
          npm publish --access public
