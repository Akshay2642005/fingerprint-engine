# Fingerprint Engine — CI Pipeline
#
# Runs on pushes to master and PRs targeting master.
# Verifies the test suite and the WASM build on a single Linux runner.
#
# The engine is deterministic and ships two artifacts — the browser WASM
# module and the worker executable (deployed as a Docker container via
# deploy/Dockerfile.worker) — so one platform is enough to gate merges.
# There is no native SDK build.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  ZIG_VERSION: 0.14.1
  # Node 20 deprecation: GitHub runners use Node 24 by default
  # These actions work fine on Node 24 despite the deprecation warnings
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Run unit tests
        run: zig build test --summary all

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM module
        run: zig build wasm --release=small

      - name: Verify WASM output exists
        run: |
          if [ -f zig-out/bin/fingerprint.wasm ]; then
            echo "✅ WASM binary found: $(ls -lh zig-out/bin/fingerprint.wasm | awk '{print $5}')"
          else
            echo "❌ WASM binary not found"
            exit 1
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-wasm
          path: zig-out/bin/fingerprint.wasm
          retention-days: 30

  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build worker executable
        run: zig build worker --release=safe

      - name: Verify worker output exists
        run: |
          if [ -f zig-out/bin/worker ]; then
            echo "✅ worker binary found: $(ls -lh zig-out/bin/worker | awk '{print $5}')"
          else
            echo "❌ worker binary not found"
            exit 1
          fi

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-worker
          path: zig-out/bin/worker
          retention-days: 30

  docker-worker:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build worker Docker image
        run: zig build docker:worker

      - name: Resolve image tag from build.zig.zon
        id: tag
        run: |
          VERSION=$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)
          echo "tag=fingerprint-worker:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify image exists
        run: |
          docker image inspect ${{ steps.tag.outputs.tag }} > /dev/null
          echo "✅ image ${{ steps.tag.outputs.tag }} built"

      - name: Smoke test image entrypoint
        run: |
          docker run --rm --entrypoint /usr/local/bin/worker ${{ steps.tag.outputs.tag }} version
