# Fingerprint Engine — CI Pipeline
#
# Runs on pushes to develop/master and PRs targeting develop/master.
# Verifies the test suite and the WASM build on a single Linux runner.
#
# The engine is deterministic and ships two artifacts — the browser WASM
# module and the worker executable (deployed as a Docker container via
# deploy/Dockerfile.worker) — so one platform is enough to gate merges.
# There is no native SDK build.

name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  # Manual re-run. NOTE: registers only once the default branch (master)
  # carries this trigger — until v0.5.0, verify CI by pushing a commit to
  # develop or opening a PR (golden-capture auto-commits use GITHUB_TOKEN,
  # which never triggers CI on its own).
  workflow_dispatch:

env:
  ZIG_VERSION: 0.14.1
  # Node 20 deprecation: GitHub runners use Node 24 by default
  # These actions work fine on Node 24 despite the deprecation warnings
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Show Zig version
        run: zig version

      - name: Run unit tests
        run: zig build test --summary all

  test-macos:
    name: Test (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run unit tests
        run: zig build test --summary all

  test-ts-sdk:
    name: TS SDK Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TS SDK dependencies
        run: npm install
        working-directory: src/clients/browser

      - name: Build TS SDK dist
        run: zig build clients:browser

      - name: Run TS SDK tests
        run: npm test
        working-directory: src/clients/browser

  browser-matrix:
    name: Browser Matrix
    # Pinned image — must match golden-capture.yml exactly: the pins are
    # captured on this image and Layer 2 re-collects on it (design doc,
    # "Environment rules").
    runs-on: ubuntu-24.04
    env:
      BRAVE_VERSION: 1.97.56
      # sha256 of brave-browser-1.97.56-linux-amd64.zip (release asset)
      BRAVE_SHA256: 8acac76eae35942e30cc63e05adc772f632ad87be8a5ffb3d8a6e280380584ec

    steps:
      - uses: actions/checkout@v4

      - name: Verify runner design doc exists
        run: test -f specs/quality/browser-matrix-design.md

      - name: Check pin manifest
        id: pins
        run: |
          if [ -f tests/fixtures/browser/pins.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pins.json absent — golden capture pending; matrix gate skipped (run golden-capture workflow)"
          fi

      - name: Setup Zig
        if: steps.pins.outputs.present == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node.js
        if: steps.pins.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TS SDK dependencies
        if: steps.pins.outputs.present == 'true'
        run: npm install
        working-directory: src/clients/browser

      - name: Build TS SDK dist
        if: steps.pins.outputs.present == 'true'
        run: zig build clients:browser

      - name: "Layer 1: replay committed snapshots through SDK + engine hash"
        if: steps.pins.outputs.present == 'true'
        run: node tests/browser-matrix/hash-verify.mjs --check

      - name: Install runner dependencies
        if: steps.pins.outputs.present == 'true'
        run: npm ci
        working-directory: tests/browser-matrix

      - name: Install Playwright browsers (Firefox + WebKit only)
        if: steps.pins.outputs.present == 'true'
        run: npx playwright install --with-deps firefox webkit
        working-directory: tests/browser-matrix

      - name: Install Chromium-family system deps (for Brave)
        if: steps.pins.outputs.present == 'true'
        run: npx playwright install-deps chromium
        working-directory: tests/browser-matrix

      # .deb would need brave-keyring (not shipped as a release asset); the
      # zip is self-contained. sha256 pins the exact binary; FP_BRAVE points
      # collect.mjs at it (lazy resolve, see resolveBrave()).
      - name: Install Brave (Chromium-family engine — never Chrome/Chromium)
        if: steps.pins.outputs.present == 'true'
        run: |
          curl -fsSL -o /tmp/brave.zip "https://github.com/brave/brave-browser/releases/download/v${BRAVE_VERSION}/brave-browser-${BRAVE_VERSION}-linux-amd64.zip"
          echo "${BRAVE_SHA256}  /tmp/brave.zip" | sha256sum -c -
          mkdir -p "$HOME/brave"
          unzip -q /tmp/brave.zip -d "$HOME/brave"
          chmod +x "$HOME/brave/brave"
          echo "FP_BRAVE=$HOME/brave/brave" >> "$GITHUB_ENV"
          "$HOME/brave/brave" --version

      - name: "Layer 2: live collection (3 engines × 3 repeats)"
        if: steps.pins.outputs.present == 'true'
        run: node tests/browser-matrix/collect.mjs --repeats=3

      - name: "Layer 2: live digest vs pins (warn-only while provisional)"
        if: steps.pins.outputs.present == 'true'
        run: node tests/browser-matrix/hash-verify.mjs --check --live --snapshots=tests/browser-matrix/captures

      - name: "Layer 2: per-signal diff artifact (D4 raw material)"
        if: always() && steps.pins.outputs.present == 'true'
        run: node tests/browser-matrix/diff-snapshots.mjs --out=browser-matrix-diff.md

      - name: Upload diff artifact
        if: always() && steps.pins.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-diff
          path: browser-matrix-diff.md
          retention-days: 30
          if-no-files-found: ignore

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM module
        run: zig build wasm --release=small

      - name: Verify WASM output exists
        run: |
          if [ -f zig-out/bin/fingerprint.wasm ]; then
            echo "✅ WASM binary found: $(ls -lh zig-out/bin/fingerprint.wasm | awk '{print $5}')"
          else
            echo "❌ WASM binary not found"
            exit 1
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-wasm
          path: zig-out/bin/fingerprint.wasm
          retention-days: 30

  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build worker executable
        run: zig build worker --release=safe

      - name: Verify worker output exists
        run: |
          if [ -f zig-out/bin/worker ]; then
            echo "✅ worker binary found: $(ls -lh zig-out/bin/worker | awk '{print $5}')"
          else
            echo "❌ worker binary not found"
            exit 1
          fi

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-worker
          path: zig-out/bin/worker
          retention-days: 30

  cmd-build:
    name: Combined + Ingress Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build combined and standalone binaries
        run: zig build fingerprint ingress --release=safe

      - name: Verify outputs exist
        run: |
          if [ -f zig-out/bin/fingerprint ]; then
            echo "✅ fingerprint binary found: $(ls -lh zig-out/bin/fingerprint | awk '{print $5}')"
          else
            echo "❌ fingerprint binary not found"
            exit 1
          fi
          if [ -f zig-out/bin/ingress ]; then
            echo "✅ ingress binary found: $(ls -lh zig-out/bin/ingress | awk '{print $5}')"
          else
            echo "❌ ingress binary not found"
            exit 1
          fi

      - name: Smoke test combined binary dispatch (ADR-011)
        run: |
          ./zig-out/bin/fingerprint version
          ./zig-out/bin/fingerprint worker version
          ./zig-out/bin/ingress version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-binaries
          path: |
            zig-out/bin/fingerprint
            zig-out/bin/ingress
          retention-days: 30

  docker-worker:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build worker Docker image
        run: zig build docker:worker

      - name: Resolve image tag from build.zig.zon
        id: tag
        run: |
          VERSION=$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)
          echo "tag=fingerprint-worker:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify image exists
        run: |
          docker image inspect ${{ steps.tag.outputs.tag }} > /dev/null
          echo "✅ image ${{ steps.tag.outputs.tag }} built"

      - name: Smoke test image entrypoint
        run: |
          docker run --rm --entrypoint /usr/local/bin/worker ${{ steps.tag.outputs.tag }} version

  docker-ingress:
    name: Docker Ingress Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build ingress Docker image
        run: zig build docker:ingress

      - name: Resolve image tag from build.zig.zon
        id: tag
        run: |
          VERSION=$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)
          echo "tag=fingerprint-ingress:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify image exists
        run: |
          docker image inspect ${{ steps.tag.outputs.tag }} > /dev/null
          echo "✅ image ${{ steps.tag.outputs.tag }} built"

      - name: Smoke test image entrypoint
        run: |
          docker run --rm --entrypoint /usr/local/bin/ingress ${{ steps.tag.outputs.tag }} version
