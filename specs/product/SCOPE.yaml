# Project Scope — Fingerprint Engine (Post-Rework)

name: Fingerprint Engine
version: 0.2.2
engine_phases: 1-11 (complete) + rework/distributed-engine (complete)
current_milestone: "Distributed engine — v0.2.2"

targets:
  - browser: "TypeScript signal-collection SDK — collects signals, packages them (SignalPackage v2), POSTs to the ingress. Never computes the canonical fingerprint."
  - workers: "Stateless Zig worker executable in Docker containers — engine.process() computes the canonical fingerprint, risk, entropy, similarity"
  - wasm: "Infra-only artifact for benchmarking and wasmtime test containers (not shipped in the npm package)"

milestones:
  - name: "M1 — Fill the gaps"
    description: "Implement all empty scaffolded directories and missing infrastructure"
    priority: done
  - name: "M2 — Integration SDKs"
    description: "Package and distribute for real consumers (npm only; PyPI/Cargo dropped with the native SDK)"
    priority: done
  - name: "M3 — Production readiness"
    description: "Hardening, benchmarks, security, cross-platform verification"
    priority: done
  - name: "M4 — Distributed rework"
    description: "Deterministic engine, async IO, transports + AMQP adapter, worker + Docker, TS SDK"
    priority: done
  - name: "M5 — Platform integration"
    description: "Ingress + worker deployment, AMQP consumer e2e, fraud-platform (Go) integration — out of repo where applicable"
    priority: next

principles:
  - Deterministic — same input, same output, any platform
  - Transport-free core — engine never knows about queues, HTTP, or databases
  - Everything depends inward — adapters depend on the engine, never the reverse
  - Compile-time first — validate at compile time, not runtime
  - Zero runtime allocation in core algorithms
  - CI must pass on every commit

out_of_scope:
  - "The Go fraud platform (Postgres rule engine, similarity candidate selection, admin workspace, AI agents) — separate repository consuming our AMQP events (D15/D18/D19)"
  - "Native SDK and C ABI (D10) — workers ship as Docker containers"
  - "PyPI and crates.io packages (dropped with the native SDK)"
  - "RabbitMQ on the inbound path (D16) — inbound is FPKG request/response; AMQP is outbound-only"
  - "In-browser canonical fingerprint computation (D14) — the browser collects and packages only"
