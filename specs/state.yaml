modules:
  model:
    - features (102 signals, 21 categories)
    - fingerprint (FeatureValue, Feature, Fingerprint, Metadata)
    - registry (compile-time feature registry)
  core:
    - serialization (binary TLV + JSON)
    - normalization (type + bounds validation)
    - hashing (SHA-256, incremental, batch)
    - validation (required-feature checking)
    - similarity (feature + fingerprint scoring)
    - entropy (Shannon entropy analysis)
    - risk (risk assessment engine)
  serialization:
    - binary (SignalPackage v2 body, v1 compat)
    - json (human-readable)
    - codec (comptime CodecID/Codec interface)
    - integrity (SHA-256 payload integrity)
  engine:
    - operation/status/codec (versioned enums)
    - request/response (immutable request, caller-owned response)
    - process (comptime dispatch table)
  io:
    - message (arena-backed Message/MessagePool)
    - ring_buffer, channel
    - completion, executor
    - frame (FPKG envelope)
    - reader, writer, dispatcher
  adapter:
    - transport (comptime contract, FPKG framing)
    - loopback, tcp
    - amqp (client, protocol, types, result publisher)
  worker:
    - cli (start --transport=loopback|tcp --publish=none|amqp)
  browser:
    - sdk (hand-written TS: index, types, package, transport, middleware, collectors)
    - generated (tables.ts, config.ts from the Zig model)
    - wasm (infra-only artifact: bench + wasmtime test containers)

ci_cd:
  ci: green (test, wasm-build, worker-build, docker-worker)
  release: green (creates GitHub Release with WASM artifact, pushes GHCR image)
  npm_publish: automated via OIDC trusted publisher (release pipeline)

handoff:
