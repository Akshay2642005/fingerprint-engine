    summary: "2026-08-08 audit — bugs registry, hardening, ingress + logging designs; slices S1–S6 sequenced in specs/quality/audits/2026-08-08.md. All six slices shipped in v0.4.0. S5 delivered the client push-consumer surface (`qos`, `consume`, `consume_next`, `consume_body`, `consumer_ack`, `consumer_nack`, `basic_deliver` dispatch; live-broker e2e in tests/adapter/amqp_test.zig), the `fingerprint.dlx` -> `fingerprint.dlq` topology declared on publisher connect, and the `amqp dlq` inspector. Residual gap carried into M8/ADR-016: the engine's **own publish path** does not dead-letter — `mandatory = false` silently discards unroutable messages, `basic_return` is handled as `fatal()`, and poison frames are acked and dropped (`worker.zig`). Follow-up PR #31 fixed compose container-name DNS resolution."

