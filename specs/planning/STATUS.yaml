    status: done
    started: "2026-10-27"
    completed: "2026-10-27"
    target: "v0.6.0 (shipped 2026-10-27)"
    summary: "Event envelope + platform ledger contract. D1 done: ADR-013 Adopted, superseded Zig `stored`/AOF plan removed, ledger idempotency fixed on SDK-minted `package_id`, M7 re-dated to Weeks 5–6. D2 done: `fingerprint_result` v2 emits the 72-byte two-digest layout (v1 prefix unchanged + core triple), with a compile-time layout pin, window-resize and core-subset property tests, and a pinned core-digest golden (spec 86-byte figure corrected to 72). D3 done: `collection_event = 10` (outbound only) plus the deterministic ADR-013 JSON envelope encoder with a byte-for-byte golden, key-order, registry-name, risk-flag, and JSON round-trip tests. D4 done: `x-fpkg-session-id` parsed/validated/CORS-allow-listed at the ingress and forwarded through the new inbound type `signal_package_context = 11`, whose payload also carries the ingress arrival time (`[u16 session_len][session][i64 ingress_received_at][body]`) so the envelope's `ingress_received_at` is real for every HTTP collection; the worker strips the header and hashes the inner body unchanged, with unit and end-to-end proofs that the digest is identical with and without a session id. D5 done: with `--publish=amqp` the worker publishes one `collection_event` frame (`result.collection-event`) per successful collection, after the unchanged digest reply; the envelope is rebuilt from the same package the engine hashed (canonicalized signals, v2 digests/counts parsed from the 72-byte reply, entropy/risk via core) and carries the ingress context. Failed collections and non-collection frames emit nothing, and build/publish failures log and drop. W6-D1 done: wire-contract/compat tests pin the SDK's 36-byte read of the 72-byte reply (core triple unexposed, trailing bytes ignored) and the envelope's cross-build determinism, integrity, and SDK-minted `package_id`. W6-D2 done: `deploy/ledger/` ships the platform-side ledger contract (Postgres DDL, MongoDB validator + indexes, ingestion README) and a generated example envelope (`tests/fixtures/ledger/collection-event-v2.json`) pinned by `tests/ledger/ledger_fixture_test.zig`; the engine still has no database dependency. W6-D3 done: the ingress authenticates requests with HMAC-SHA256 over [collected_at, nonce, sha256(body)] when `FPKG_HMAC_SECRET` is set, failing closed on missing/malformed/forged/stale/replayed requests before framing, with a constant-time compare, a bounded replay cache (compact + refuse rather than evict), and previous-secret rotation. W6-D4 done: the security plan is refreshed for v0.6.0 around the M7 surface — data egress (reply vs envelope), boundary caps, replay/idempotency layers and owners, ledger PII/at-rest policy, HMAC secret handling/rotation, the AMQP-credential gap, and platform-side scope. W6-D5 done: the M7 review checklist (`specs/quality/verifications/v0.6.0.md`) is green, the product snapshot is written (`specs/product/snapshots/v0.6.0.md`), and v0.6.0 is cut (engine 549/549, 30/30 SDK, 11 CI checks)."

