modules:
  model:
    - features (102 signals, 21 categories)
    - fingerprint (FeatureValue, Feature, Fingerprint, Metadata)
    - registry (compile-time feature registry)
  core:
    - serialization (binary TLV + JSON)
    - normalization (type + bounds validation)
    - hashing (SHA-256, incremental, batch)
    - validation (required-feature checking)
    - similarity (feature + fingerprint scoring)
    - entropy (Shannon entropy analysis)
    - risk (risk assessment engine)
  serialization:
    - binary (SignalPackage v2 body, v1 compat)
    - json (human-readable)
    - codec (comptime CodecID/Codec interface)
    - integrity (SHA-256 payload integrity)
  engine:
    - operation/status/codec (versioned enums)
    - request/response (immutable request, caller-owned response)
    - process (comptime dispatch table)
  io:
    - message (arena-backed Message/MessagePool)
    - ring_buffer, channel
    - completion, executor
    - frame (FPKG envelope)
    - reader, writer, dispatcher
  adapter:
    - transport (comptime contract, FPKG framing)
    - loopback, tcp
    - amqp (client, protocol, types, result publisher)
  worker:
    - cli (start --transport=loopback|tcp --publish=none|amqp)
    - logging (--log-level= --log-format=, FPKG_LOG_LEVEL/FPKG_LOG_FORMAT, F-2/S3)
  scripts:
    - worker request (FPKG round-trip against a running worker)
    - amqp get (live broker inspector — throwaway queue bound to all 9 result routing keys)
    - amqp get --quiet (suppress the info(amqp) connection dump)
    - generate fixture signal-package-v2
    - docker build-worker/run helpers
  ingress:
    - delivered (M5/S4 — specs/architecture/ingress.md; worker pool + HTTP server)
    - logging (--log-level= --log-format=, F-2/S3)
  logging:
    - src/log.zig leaf module (Level/Scope/Format, text/json, UTC timestamps)
    - std_options.logFn routing (TigerBeetle pattern) in worker/ingress/fingerprint/scripts
  browser:
    - sdk (hand-written TS: index, types, package, transport, middleware, collectors)
    - generated (tables.ts, config.ts from the Zig model)
    - wasm (infra-only artifact: bench + wasmtime test containers)

ci_cd:
  ci: green (test, wasm-build, worker-build, docker-worker)
  release: green (creates GitHub Release with WASM artifact, pushes GHCR image)
  npm_publish: automated via OIDC trusted publisher (release pipeline)

handoff:
  next_skill: "elaborate-spec"
  note: |
    Distributed-engine roadmap complete (M1–M5); v0.4.1 shipped with the
    Docker/AMQP DNS fix (PR #31). 457 tests green. The v1.0.0 path is defined
    in specs/planning/ROADMAP-v1.0.0.md — M6 (API & determinism contract) is
    active: ADR-012 (versioning/compatibility) adopted; ABI pin + registry lock
    done. W3 (cross-browser golden matrix): D1–D4 done — golden capture
    authoritative on ubuntu-24.04, PRs gate strictly, and the per-signal
    determinism matrix is published (specs/quality/signal-determinism-matrix.md:
    CI 3x3 + local Brave 10x10 stable, 38 cross-env diffs classified, no
    run-to-run drift), and W3-D5 is done: the determinism contract
    (specs/quality/signal-determinism-contract.md) plus the locked stable-core
    subset (registry `core` flag + `core_version = 1` + comptime lock guard, 24
    features). 491 tests green. W4-D1 is merged (#53): the SDK 1.0 public surface
    is frozen in specs/product/SDK_API_SURFACE.md, with `packageSignals()` +
    `PackageResult` added and `CollectResult.status`/`error` surfacing transport
    failures. W4-D2 pins the toolchain and publishes the SemVer/deprecation
    rulebook (specs/product/SDK_DEPRECATION_POLICY.md; TypeScript 5.9.3,
    `types: []`, single typed export). W4-D3 is done: `contract.test.mjs` pins
    the collect→package→POST round trip and error paths, and the type-level
    contract (`tests/clients/browser/types/surface.ts`, `npm run test:types`)
    is wired into CI — 28/28 runtime tests. W4-D4 is done: the 1.0 canary
    `1.0.0-rc.1` is live on the public registry under `@next` (38 files,
    provenance published; `latest` remains `0.4.1`). A clean consumer installed
    from npm and `packageSignals()` produced 57 signals and a 1006-byte
    SignalPackage v2 body. Conventions are recorded in
    specs/product/SDK_RELEASE_CONVENTIONS.md. SDK publishing is decoupled
    from engine tags: `sdk-publish.yml` (manual, OIDC, version-driven) publishes
    the package, and `release.yml` skips npm when the tag and package version
    differ. The registry-verification step now retries through npm replication
    lag instead of reporting a successful publish as a failure. W4-D5 is done:
    the M6 review checklist (specs/quality/verifications/v0.5.0.md) is green,
    the product snapshot is written (specs/product/snapshots/v0.5.0.md), and
    v0.5.0 is cut (engine 491/491; 10 required CI checks). M7 has started
    (2026-10-27): ADR-013 is Adopted, the superseded Zig `stored`/AOF plan is
    removed from the roadmap, ledger idempotency is fixed on the SDK-minted
    `package_id`, and M7 is re-dated to Weeks 5–6 (Oct 27 – Nov 6) with the
    cut at v0.6.0. D2 is done: `fingerprint_result` v2 now emits the 72-byte
    two-digest layout (36-byte v1 prefix + `core_digest` /
    `core_feature_count` / `core_version`), guarded by a compile-time layout
    pin plus window-resize, core-subset, and golden-digest tests. The old
    86-byte figure in the specs was arithmetic drift and is corrected to 72.
    D3 is done: `collection_event = 10` is an outbound-only message type (the
    worker maps it to no engine operation and it carries no status byte), and
    `serialization.encodeCollectionEvent` emits the ADR-013 envelope as
    deterministic JSON in frozen key order, pinned by a byte-for-byte golden
    plus key-order, registry-name, risk-flag, and JSON round-trip tests.
    D4 is done: the ingress parses and validates `x-fpkg-session-id`
    (1-128 bytes of [A-Za-z0-9._:-], CORS-allow-listed, 400 otherwise) and
    forwards it in the new inbound frame type `signal_package_context = 11`
    as `[u16 session_len][session][i64 ingress_received_at][body]`, so the
    envelope's ingress timestamp is real for HTTP traffic (direct frame
    clients record 0); the worker strips the header and hands the inner body
    to the engine unchanged, proven by unit and e2e tests to produce an
    identical digest with and without a session id. D5 is done: with
    `--publish=amqp` the worker publishes one `collection_event` frame
    (`result.collection-event`) per successful collection, after the unchanged
    digest reply. The envelope is rebuilt from the same package the engine
    hashed (canonicalized signals, v2 digests/counts parsed from the 72-byte
    reply, entropy/risk via core) and carries the ingress session id and
    arrival time. Failed collections and non-collection frames emit nothing;
    build/publish failures log and drop, leaving the live `result.*` fanout as
    the fallback. W6-D1 is done: compatibility tests pin the SDK reading the
    72-byte two-digest reply through its 36-byte path (identical status,
    digest, counts; the core triple never reaches the public surface; unknown
    trailing bytes are ignored) and the worker envelope's cross-build
    byte-identity, integrity digest, and SDK-minted `package_id`. W6-D2 is
    done: `deploy/ledger/` is the platform-side persistence contract for the
    envelope — Postgres DDL (`collection_events`, `uuid` primary key on the
    SDK-minted `package_id`, btree on `fingerprint_id`/`session_id`/timestamps,
    `jsonb_path_ops` GIN over `signals`), the equivalent MongoDB validator with
    unique/partial/wildcard indexes, and a README covering the 48-byte FPKG
    header strip, epoch-ms → timestamptz conversion, `ON CONFLICT DO NOTHING`
    / Mongo 11000 idempotency, and signals privacy. The example envelope
    (`tests/fixtures/ledger/collection-event-v2.json`) is generated by the
    production encoder through the real worker reply path, so it cannot drift
    from the wire bytes. The engine gains no database dependency.
    W6-D3 is done: the ingress authenticates requests itself. With
    `FPKG_HMAC_SECRET` (32+ characters) set, every POST must carry
    `x-fpkg-collected-at`, `x-fpkg-nonce` and
    `x-fpkg-signature: hmac-sha256=<hex>` over
    `fpkg-hmac-v1 / collected_at / nonce / sha256(body)`; missing, malformed,
    forged, stale (outside `FPKG_HMAC_WINDOW_MS`, default five minutes, past or
    future) and replayed requests are rejected before the body is framed
    (401/409). The MAC comparison is constant time, the nonce cache is bounded
    and compacted (503 when exhausted instead of evicting a live nonce), and
    `FPKG_HMAC_SECRET_PREVIOUS` allows rotation. Authentication is off unless a
    secret is configured (D-v1-2); the browser SDK cannot hold a secret, so
    signing is a trusted-edge/platform-gateway job.
    Next: the SECURITY_PLAN refresh (W6-D4), then the M7 review and the v0.6.0
    cut.
