# Release Plan — Fingerprint Engine
target_version: 0.4.0
next_target: TBD
note: |
  The distributed-engine roadmap (M1–M5) is complete. v0.4.0 is the current
  shipped release. A follow-on fix post-0.4.0 resolved compose container-name
  DNS resolution (PR #31); no functional feature shipped with it. The next
  milestone is unplanned — awaiting product direction (see
  specs/planning/PHASES.yaml -> next_phase).

releases:
  v0.4.0:
    status: released
    date: "2026-08-24"
    followups:
      - "fix(debug): compose container-name DNS resolution (PR #31, 2026-08-28)"
    epics:
      - rework/distributed-engine
    summary: |
      AMQP push consumer + DLQ topology, full-stack compose (rabbitmq +
      worker + ingress), ingress GHCR image, cross-platform native binary
      releases (linux x86_64/aarch64 musl, macOS x86_64/aarch64).

  v0.3.0:
    status: released
    date: "2026-08-17"
    epics:
      - rework/distributed-engine
    summary: |
      Audit hardening pass (R-1 through R-8, C-1/C-2/C-5/C-7, D-1 through D-5):
      comptime exhaustiveness checks, buffer overflow guards, IPv6 support,
      WASM scratch aliasing guard, assertion density sweep, function splits,
      CI matrix expansion (macOS + TS SDK tests), dead code removal.
      All BUGs BUG-001 through BUG-016 resolved. Version bump to 0.3.0.

  v0.2.2:
    status: released
    date: "2026-08-08"
    epics:
      - rework/distributed-engine
    summary: |
      Release pipeline hardening: worker image released to GitHub Container
      Registry (lowercased image tags), idempotent npm publish (skips
      already-published versions), version bump to 0.2.2. npm publishing is
      automated via the OIDC trusted publisher.

  v0.2.1:
    status: released
    date: "2026-08-08"
    epics:
      - rework/distributed-engine
    summary: |
      Distributed rework delivery: deterministic engine (Operation/Request/
      Response, comptime dispatch), async IO primitives (Message, RingBuffer,
      Channel, Executor, FPKG Frame, Reader/Writer, Dispatcher), loopback/tcp
      transports + AMQP 0-9-1 adapter with result publisher, worker executable
      with Docker image, SignalPackage v2 serialization, hand-written TypeScript
      SDK (collect → package → POST; middleware for fraud-platform decisions),
      npm package readme, SDK-driven example page, docs site refresh. 382 tests
      passing. npm publishing stays manual.

  v0.2.0:
    status: released
    date: "2026-08-07"
    epics:
      - rework/distributed-engine
    summary: |
      Breaking rework milestone: Zig downgrade to 0.14.1, O(1) `zig build`
      system, layered repo structure (src/{core,model,serialization,engine,io,
      adapter,worker,clients}), self-verifying test registry, integration/e2e
      harness, docs snapshot step, browser demo moved out of the npm package,
      native SDK and C ABI removed (workers ship as Docker containers).

  v0.1.1:
    status: released
    date: "2026-07-11"
    epics:
      - scratch-buffer-fix
      - docs-corrections
      - version-bump
    summary: |
      Bug fix release. Fixes WASM scratch buffer corruption (string/bytes features
      crashed with unreachable). Corrects docs (37 → 102 signals). Fixes UMD
      template, package URLs, and version consistency.

  v0.1.0:
    status: released
    date: "2026-07-11"
    epics:
      - e01-core-engine
      - e02-browser-sdk
      - e03-server-sdk
      - e04-integration-quality
    summary: |
      MVP release. Core engine (9 modules), browser WASM SDK with 11 collectors,
      server C ABI, TypeScript bindings, CI/CD pipelines, npm package.

v0.2.0_planned:
  status: superseded
  note: |
    The original v0.2.0 plan (npm automation, PyPI, crates.io, WASM size, docs
    site, server matching engine) was superseded by the distributed rework
    (specs/decisions/rework/). Final decisions:
    - npm automation → manual `npm publish` (OIDC trusted publisher not used)
    - PyPI / crates.io → dropped; no native SDK
    - WASM size → wasm is an infra artifact only (bench/test containers)
    - docs site → delivered via `zig build docs` + GitHub Pages
    - server matching engine → out of repo; the Go fraud platform (separate
      repository) consumes worker events and runs business rules
